<!doctype html>
<html lang="en">
  <head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-52M2R0WYH0"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-52M2R0WYH0');
    </script>

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0, viewport-fit=cover" />
    <title>Kortex Ai</title>
    <link rel="icon" type="image/png" href="/logo.png" />
    
    <!-- PWA configuration and mobile styling -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Kortex AI" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Service worker registration script and PWA Install Event Capturer -->
    <script>
      window.deferredPrompt = null;
      
      window.addEventListener('beforeinstallprompt', (e) => {
        // Let the browser show its native install UI
        window.deferredPrompt = e;
        console.log('[PWA] beforeinstallprompt caught');
      });

      window.addEventListener('appinstalled', (e) => {
        console.log('[PWA] App successfully installed!');
        window.deferredPrompt = null;
        window.dispatchEvent(new Event('appinstalled'));
      });

      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((registration) => {
              console.log('[PWA] Service Worker registered successfully:', registration.scope);
            })
            .catch((error) => {
              console.error('[PWA] Service Worker registration failed:', error);
            });
        });
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
